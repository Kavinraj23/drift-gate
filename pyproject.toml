[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "driftgate"
version = "0.1.0"
description = "Agent that investigates failed CI executions and remediates through deterministic safety gates."
requires-python = ">=3.11"
dependencies = [
    "anthropic",
    "requests",
    "python-dotenv",
    "jsonschema",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["docs", "playground"]

[tool.ruff.format]
docstring-code-format = false

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
